# Wavecraft — écarte le pilote de télévision numérique.
#
# dvb_usb_rtl28xxu s'empare de la clé dès qu'elle est branchée : tant qu'il est
# chargé, aucune écoute n'est possible. La clé n'est alors plus utilisable pour
# regarder la TNT, ce qui est le but.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
